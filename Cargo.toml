[workspace]
members = [
    "crates/helmcraft-store",
    "crates/helmcraft-core",
    "crates/helmcraft-mcp",
    "crates/helmcraft-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sandraschi fleet"]
repository = "https://github.com/sandraschi/helmcraft"

[workspace.dependencies]
craft-biz = { path = "../craft-biz/crates/craft-biz" }
craft-biz-ui = { path = "../craft-biz/crates/craft-biz-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
egui = "0.37"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
